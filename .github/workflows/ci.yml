name: Architecture Protection CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  architecture-protection:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run existing unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          monitor_runner.py
          diagnostic_worker.py
          diagnostics
          providers
          research/dp-document/tools
          tests
          tools

      - name: Check architecture boundaries
        run: python -m tools.architecture.check_boundaries

      - name: Check notification layer direction
        run: python -m tools.architecture.check_layer_direction

      - name: Check repository hygiene
        run: python -m tools.architecture.check_hygiene --check-worktree
